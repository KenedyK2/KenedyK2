<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400.0 663.5" width="100%" height="100%">
    <style>
        .cmd-bg {
            fill: #0c0c0c;
            stroke: #333333;
            stroke-width: 1px;
        }
        .cmd-titlebar {
            fill: #c0c0c0;
        }
        .cmd-title-text {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 11px;
            fill: #000000;
        }
        .cmd-text {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            fill: #cccccc;
        }
        .cmd-path {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            fill: #cccccc;
            font-weight: bold;
        }
        .ascii-line {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            fill: #f0f0f0;
            white-space: pre;
            opacity: 0;
            animation: revealLine 0.4s ease forwards;
        }
        .line-0 { animation-delay: 0.200s; }
    .line-1 { animation-delay: 0.240s; }
    .line-2 { animation-delay: 0.280s; }
    .line-3 { animation-delay: 0.320s; }
    .line-4 { animation-delay: 0.360s; }
    .line-5 { animation-delay: 0.400s; }
    .line-6 { animation-delay: 0.440s; }
    .line-7 { animation-delay: 0.480s; }
    .line-8 { animation-delay: 0.520s; }
    .line-9 { animation-delay: 0.560s; }
    .line-10 { animation-delay: 0.600s; }
    .line-11 { animation-delay: 0.640s; }
    .line-12 { animation-delay: 0.680s; }
    .line-13 { animation-delay: 0.720s; }
    .line-14 { animation-delay: 0.760s; }
    .line-15 { animation-delay: 0.800s; }
    .line-16 { animation-delay: 0.840s; }
    .line-17 { animation-delay: 0.880s; }
    .line-18 { animation-delay: 0.920s; }
    .line-19 { animation-delay: 0.960s; }
    .line-20 { animation-delay: 1.000s; }
    .line-21 { animation-delay: 1.040s; }
    .line-22 { animation-delay: 1.080s; }
    .line-23 { animation-delay: 1.120s; }
    .line-24 { animation-delay: 1.160s; }
    .line-25 { animation-delay: 1.200s; }
    .line-26 { animation-delay: 1.240s; }
    .line-27 { animation-delay: 1.280s; }
    .line-28 { animation-delay: 1.320s; }
    .line-29 { animation-delay: 1.360s; }
    .line-30 { animation-delay: 1.400s; }
    .line-31 { animation-delay: 1.440s; }
    .line-32 { animation-delay: 1.480s; }
    .line-33 { animation-delay: 1.520s; }
    .line-34 { animation-delay: 1.560s; }
    .line-35 { animation-delay: 1.600s; }
    .line-36 { animation-delay: 1.640s; }
    .line-37 { animation-delay: 1.680s; }
    .line-38 { animation-delay: 1.720s; }
    .line-39 { animation-delay: 1.760s; }
    .line-40 { animation-delay: 1.800s; }

        @keyframes revealLine {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- Fundo Preto do CMD -->
    <rect width="100%" height="100%" rx="0" class="cmd-bg"/>

    <!-- Barra de Título Clássica do Windows -->
    <rect width="100%" height="28" class="cmd-titlebar"/>

    <!-- 🔲 Container do ícone do Prompt de Comando no canto esquerdo -->
    <rect x="8" y="7" width="14" height="14" fill="#000000" rx="1"/>
    <text x="10.5" y="17.5" font-family="Consolas" font-size="9" fill="#ffffff">&gt;_</text>

    <!-- Título da janela -->
    <text x="28" y="18" class="cmd-title-text">Prompt de Comando</text>

    <!-- Botões do Windows no canto direito -->
    <text x="335.0" y="18" class="cmd-text" font-family="Arial">&#x1f5d5;</text>
    <text x="355.0" y="18" class="cmd-text" font-family="Arial">&#x1f5d6;</text>
    <text x="380.0" y="18" class="cmd-text" font-family="Arial">&#x2715;</text>

    <!-- Versão do Windows -->
    <text x="20" y="48" class="cmd-text" font-size="11" fill="#888888">Microsoft Windows [versão 10.0.19045.3930]</text>

    <!-- Linha do Prompt com o seu GitHub -->
